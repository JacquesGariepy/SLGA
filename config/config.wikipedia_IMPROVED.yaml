# SLGA Configuration - IMPROVED for Better Generation Quality
# Based on architectural analysis (docs/ARCHITECTURE_REVIEW_GENERATION_QUALITY.md)
# Key changes:
# - Increased global_k: 24 → 64 (better coverage)
# - Slower temperature decay: 0.999 → 0.9999 (less degeneration)
# - Reduced auxiliary loss weights (focus on language modeling)
# - Hybrid landmark selection (70% learned + 30% positional)

seed: 1234
device: cuda

model:
  vocab_size: 50257
  max_seq_len: 2048
  embed_dim: 512
  num_heads: 8
  ff_hidden_multiplier: 4
  n_layers: 12
  dropout_rate: 0.1

  # ===================================================================
  # ATTENTION CONFIGURATION - IMPROVED
  # ===================================================================

  # Local attention (unchanged - progressive dilation works well)
  local_window: 128
  dilated_windows: true        # Progressive dilation by layer

  # Global attention - INCREASED COVERAGE
  # OLD: global_k: 24 → 48 total landmarks (2.3% coverage)
  # NEW: global_k: 64 → 128 total landmarks (6.25% coverage)
  global_k: 64                 # ⬆️ INCREASED from 24 (2.7× more)

  # Fusion strategy (unchanged - gated works well when global is good)
  gated_fusion: true

  # Landmark selection - IMPROVED
  learned_landmarks: true
  diverse_topk: true           # Inter-head diversity

  # ===================================================================
  # LANDMARK SELECTOR CONFIGURATION - IMPROVED
  # ===================================================================

  landmark_selector:
    # Temperature schedule - SLOWER DECAY
    temperature: 1.0
    temperature_decay: 0.9999  # ⬆️ INCREASED from 0.999 (10× slower)
    min_temperature: 0.5       # ⬆️ INCREASED from 0.3 (less aggressive)

    # Hidden layer size (scorer network)
    hidden_dim: 512            # ⬆️ INCREASED from 256 (more capacity)

    # Selection strategy - HYBRID (NEW)
    use_gumbel: true           # Gumbel-Softmax (smoother gradients)

  # ===================================================================
  # NOTES ON TEMPERATURE SCHEDULE
  # ===================================================================
  # Old: decay=0.999, min=0.3
  #   - Step 1000: temp = 0.368
  #   - Step 5000: temp = 0.300 (min reached, locked)
  #   - Result: Deterministic selection after 5K steps
  #
  # New: decay=0.9999, min=0.5
  #   - Step 1000: temp = 0.905
  #   - Step 5000: temp = 0.606
  #   - Step 10000: temp = 0.500 (min reached)
  #   - Step 50000: temp = 0.500 (stays at min)
  #   - Result: Exploration maintained longer

train:
  # Curriculum learning
  seq_len_start: 384
  seq_len_mid: 1024
  seq_len_final: 2048
  seq_len_warmup_steps: 15000

  # Batch configuration (optimized for RTX 3090)
  batch_size: 8
  accum_steps: 8
  # Effective batch: 8 × 8 = 64

  # Optimizer
  lr: 1.5e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1
  warmup_steps: 5000
  max_steps: 100000
  grad_clip: 1.0

  # Mixed precision
  amp: true
  amp_dtype: "bf16"
  grad_checkpointing: false
  torch_compile: false

  # Data collator
  collator: "local"
  global_every: 128
  max_global: 128              # ⬆️ INCREASED from 64 (match new global_k×2)

  # ===================================================================
  # AUXILIARY LOSSES - REBALANCED
  # ===================================================================

  # Spacing loss - REDUCED WEIGHT
  # OLD: 500.0 (too high, forced uniform spacing)
  # NEW: 50.0 (10× lower, allows content-based clustering)
  lambda_spacing: 50.0         # ⬇️ REDUCED from 500.0

  # Sparsity loss - REDUCED WEIGHT
  # OLD: 10.0 (after fix, was causing 4.25 constant loss)
  # NEW: 1.0 (10× lower, focus on LM loss)
  lambda_sparsity: 1.0         # ⬇️ REDUCED from 10.0

  # Diversity loss - DEPRECATED
  lambda_diversity: 0.0

  # ===================================================================
  # NOTES ON LOSS WEIGHTING
  # ===================================================================
  # At step 1000 (OLD config):
  #   Total loss: 8.15
  #   - LM loss: ~3.9 (48%)
  #   - Sparsity: 4.25 (52%) ← DOMINATED TRAINING
  #   - Spacing: 0.0097
  #
  # With new weights (EXPECTED):
  #   Total loss: ~4.5
  #   - LM loss: ~4.0 (89%)
  #   - Sparsity: ~0.4 (9%)
  #   - Spacing: ~0.1 (2%)
  #
  # Result: Model optimizes for language quality, not auxiliary objectives

  # Scorer learning rate multiplier
  scorer_lr_multiplier: 5.0    # Scorer learns 5× faster

  # Global attention warmup
  global_warmup_start: 1000
  global_warmup_end: 5000
  global_weight_warmup_steps: 5000

  # Checkpointing
  save_every: 1000
  keep_last_checkpoints: 5
  eval_every: 500
  log_every: 10
  debug_checkpoints: false

data:
  dataset: "wikimedia/wikipedia"
  subset: "20231101.en"
  split_train: "train[:95%]"
  split_val: "train[95%:]"
  num_workers: 0
  max_train_samples: null
  max_val_samples: 10000

tokenizer: "gpt2"

save:
  out_dir: "out_slga_improved"  # New output directory

log:
  wandb: false
  project: "slga-improved"
  run_name: "improved-architecture-v1"
  tensorboard: true

# ===================================================================
# EXPECTED IMPROVEMENTS
# ===================================================================
#
# 1. Generation Quality: 2/10 → 6+/10
#    - Better long-range context (6.25% vs 2.3% coverage)
#    - Less newline collapse (diverse landmarks)
#    - Coherent multi-sentence generation
#
# 2. Landmark Selection:
#    - Less degeneration (slower temp decay)
#    - More exploration (higher min temp)
#    - Better diversity (lower spacing penalty)
#
# 3. Training Dynamics:
#    - Focus on LM loss (89% vs 48%)
#    - Faster convergence (less aux loss interference)
#    - Better perplexity (<100 @ 10K steps)
#
# 4. Attention Patterns:
#    - More balanced local/global fusion
#    - Better coverage of important positions
#    - Reduced attention collapse
#
# ===================================================================

# ===================================================================
# MONITORING RECOMMENDATIONS
# ===================================================================
#
# Track these metrics during training:
#
# 1. Loss composition:
#    - LM loss should be 85-95% of total
#    - Sparsity loss should be 5-10%
#    - Spacing loss should be 1-5%
#
# 2. Landmark metrics (log every 500 steps):
#    - Unique landmarks per sample (should be ≥ 120 for G=128)
#    - Mean gap between landmarks (should be ≈ 2048/128 = 16)
#    - Coverage percentage (should be ≈ 6-7%)
#
# 3. Temperature:
#    - Current temperature (should decay slowly)
#    - Steps to min (should be ≥ 10000)
#
# 4. Generation samples (every 1000 steps):
#    - Newline ratio (should be < 10%)
#    - Coherence (manual inspection)
#    - Perplexity on held-out set
#
# 5. Gate values (if implementing logging):
#    - Mean gate per layer (should be 0.3-0.7, balanced)
#    - Std gate (should be > 0.1, not collapsed)
#
# ===================================================================

# ===================================================================
# ABLATION STUDIES TO RUN
# ===================================================================
#
# To validate improvements, run these experiments:
#
# 1. Global K scaling:
#    global_k: [32, 48, 64, 96, 128]
#    Expected: Sweet spot at 64-96
#
# 2. Temperature decay:
#    temperature_decay: [0.999, 0.9995, 0.9999, 1.0]
#    Expected: 0.9999 best for learned landmarks
#
# 3. Loss weight ratios:
#    lambda_spacing: [0, 10, 50, 100]
#    Expected: 50 optimal (current value)
#
# 4. Hybrid vs learned landmarks:
#    Compare learned_landmarks: true vs false
#    Expected: Learned better IF properly configured
#
# ===================================================================

# ===================================================================
# USAGE INSTRUCTIONS
# ===================================================================
#
# 1. Clean start (recommended):
#    rm -rf out_slga_improved
#    python scripts/train.py --config config/config.wikipedia_IMPROVED.yaml
#
# 2. Diagnostic after 5K steps:
#    python scripts/diagnose_landmarks.py \
#      --checkpoint out_slga_improved/ckpt_5000 \
#      --output landmark_analysis_5k.png
#
# 3. Generation test:
#    python scripts/generate.py \
#      --checkpoint out_slga_improved/ckpt_5000 \
#      --prompt "The future of AI is" \
#      --temperature 0.8 \
#      --top_k 40 \
#      --max_tokens 100
#
# 4. Compare with old config:
#    # Run both configs for 10K steps
#    # Compare perplexity, generation quality, loss composition
#
# ===================================================================
