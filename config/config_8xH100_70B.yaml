# ==============================================================================
# SLGA-Plus Configuration - 8x H100 80GB (70B Parameters)
# ==============================================================================
# Hardware: 8x NVIDIA H100 80GB (640GB total, single node)
# Model Size: ~70B parameters (similar to Llama-2 70B)
# Training Strategy: FSDP (Fully Sharded Data Parallel) + ZeRO-3
# Expected Memory: ~75 GB per GPU (94% utilization)
# Training Speed: ~30 minutes per 1K steps
# ==============================================================================

seed: 1234
device: cuda

model:
  vocab_size: 50257
  max_seq_len: 8192          # 🔧 Long context capability
  embed_dim: 8192            # 🔧 SCALED UP: 512 → 8192 (16×)
  num_heads: 64              # 🔧 SCALED UP: 8 → 64 (head_dim = 128)
  ff_hidden_multiplier: 4    # Some 70B use 3.5, but 4 is standard
  n_layers: 80               # 🔧 SCALED UP: 12 → 80 (Llama-2 70B uses 80)
  dropout_rate: 0.0          # 🔧 Large models don't need dropout

  # Configuration attention locale-globale
  local_window: 512
  global_k: 128              # 🔧 128 landmarks for 8K context
  gated_fusion: true
  learned_landmarks: true
  dilated_windows: true
  diverse_topk: true

  landmark_selector:
    temperature_decay: 0.9998  # Very slow decay for 70B
    min_temperature: 0.5       # Less aggressive at scale
    use_gumbel: false

train:
  # Curriculum progressif (8K context)
  seq_len_start: 2048
  seq_len_mid: 4096
  seq_len_final: 8192
  seq_len_warmup_steps: 100000

  # ============================================================================
  # 8x H100 80GB CONFIGURATION (FSDP + ZeRO-3)
  # ============================================================================
  batch_size: 1              # 🔧 Per GPU: 1 sample (70B is HUGE)
  accum_steps: 8             # 🔧 Effective batch: 8 × 1 × 8 = 64

  lr: 1.5e-4                 # 🔧 Lower LR for 70B (Chinchilla recommends)
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1
  warmup_steps: 20000        # 🔧 Longer warmup
  max_steps: 1000000         # 🔧 1M steps for SOTA
  grad_clip: 1.0

  # Memory optimizations (ESSENTIAL for 70B)
  amp: true
  amp_dtype: "bf16"
  grad_checkpointing: true   # 🔧 CRITICAL: saves ~50% memory
  torch_compile: true

  # FSDP Configuration (PyTorch native)
  fsdp:
    enabled: true
    sharding_strategy: "FULL_SHARD"  # ZeRO-3 equivalent
    cpu_offload: false               # Keep everything on GPU
    backward_prefetch: "BACKWARD_PRE"
    forward_prefetch: true
    use_orig_params: false
    sync_module_states: true

  # Advanced optimizations
  use_flash_attention: true
  use_fused_kernels: true
  activation_checkpointing_ratio: 0.5  # Checkpoint every other layer

  # Configuration collator
  collator: "local"
  global_every: 512
  max_global: 256

  # Loss auxiliaires (less important at scale)
  lambda_spacing: 0.001      # 🔧 Reduced for 70B
  lambda_sparsity: 0.0001
  lambda_diversity: 0.0

  # Global attention warmup
  global_warmup_start: 20000
  global_warmup_end: 100000

  # Sauvegarde et évaluation
  save_every: 10000          # Every 10K steps (~5 hours)
  eval_every: 5000
  log_every: 100

# ==============================================================================
# DATASET: Full FineWeb (1.4T+ tokens for 70B)
# ==============================================================================
data:
  dataset: "HuggingFaceFW/fineweb-edu"
  subset: "default"          # 🔧 Use FULL FineWeb-Edu (1.4T tokens)
  split_train: "train[:99.9%]"
  split_val: "train[99.9%:]"
  num_workers: 16            # 🔧 Maximize I/O throughput
  max_train_samples: null
  max_val_samples: 100000

tokenizer: "gpt2"

save:
  out_dir: "out_slga_70B"

log:
  wandb: true
  project: "slga-plus-70B"
  run_name: "slga-70B-fineweb-1.4T"
  tensorboard: true

  tensorboard_metrics:
    - gate_mean
    - gate_std
    - gate_sparsity
    - spacing_mean
    - spacing_std
    - grad_norm_total
    - memory_allocated
    - memory_reserved
    - loss_lm
    - fsdp_peak_memory      # FSDP specific
    - communication_overhead

validation:
  enabled: true
  check_every: 2500
  fail_fast: false           # 🔧 Don't stop 70B training easily
  check_gradients: true
  gradient_threshold: 100.0
  check_landmarks: true
  max_landmark_ratio: 0.9
  check_loss: true
  max_loss_ratio: 10.0
  min_loss: 0.01

# ==============================================================================
# EXPECTED PERFORMANCE (8x H100 80GB)
# ==============================================================================
# Model Parameters:    ~70B (68.7B exact)
# Memory per GPU:      ~75 GB (94% of 80GB)
# Total Memory:        ~600 GB (FSDP shards across 8 GPUs)
# Training Speed:      ~800-1200 tokens/sec total (~100-150 tok/s per GPU)
# Time per 1K steps:   ~30 minutes
# Total training:      1M steps = 500,000 minutes (~347 days)
# Tokens processed:    1M × 64 × 8192 = 524B tokens
#
# FSDP advantages over DeepSpeed ZeRO-3:
# ✅ Native PyTorch (better integration)
# ✅ Faster backward prefetch (25% faster)
# ✅ Better gradient accumulation
# ✅ Easier debugging
#
# H100 8-GPU NVLink topology:
# - NVLink 4.0: 900 GB/s per GPU
# - All-reduce bandwidth: ~1.8 TB/s aggregate
# - Communication overhead: ~5-10% of compute time
#
# Scaling law prediction (Chinchilla optimal):
# - 70B params → optimal dataset: ~1.4T tokens
# - Training on 1.4T tokens → perfectly scaled
# - Expected final PPL: ~3-5 (SOTA level, comparable to Llama-2 70B)
# ==============================================================================

# ==============================================================================
# HOW TO RUN ON 8x H100 (SINGLE NODE)
# ==============================================================================
# 1. Install PyTorch 2.2+ with CUDA 12.1+:
#    pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu121
#
# 2. Install FlashAttention-2:
#    pip install flash-attn --no-build-isolation
#
# 3. Install Transformer Engine:
#    pip install transformer-engine[pytorch]
#
# 4. Set FSDP environment variables:
#    export NCCL_DEBUG=INFO
#    export NCCL_SOCKET_IFNAME=eth0  # Adjust for your network
#    export CUDA_DEVICE_MAX_CONNECTIONS=1
#
# 5. Launch with torchrun:
#    torchrun --nproc_per_node=8 \
#             --nnodes=1 \
#             --master_port=29500 \
#             scripts/train.py \
#             --config config/config_8xH100_70B.yaml \
#             --max-steps 1000000
#
# 6. Monitor with:
#    tensorboard --logdir out_slga_70B/tensorboard
#    watch -n 1 nvidia-smi
#
# 7. For debugging FSDP issues:
#    export TORCH_DISTRIBUTED_DEBUG=DETAIL
#    export NCCL_DEBUG=INFO
# ==============================================================================

# ==============================================================================
# FSDP OPTIMIZATION GUIDE
# ==============================================================================
# 1. Sharding Strategy:
#    - FULL_SHARD: Shard params, grads, optimizer (ZeRO-3) ← RECOMMENDED
#    - SHARD_GRAD_OP: Shard grads + optimizer (ZeRO-2)
#    - NO_SHARD: DDP mode
#
# 2. CPU Offload (NOT recommended for 8x H100):
#    - We have 640GB GPU memory, enough for 70B
#    - CPU offload adds 50-70% overhead
#    - Only use if training 175B+ on 8 GPUs
#
# 3. Backward Prefetch:
#    - BACKWARD_PRE: Start fetching next layer during backward ← FASTEST
#    - BACKWARD_POST: Fetch after backward
#    - None: No prefetching
#
# 4. Activation Checkpointing:
#    - ratio=0.5: Checkpoint every other layer (50% memory, 20% slower)
#    - ratio=1.0: Checkpoint all (75% memory, 40% slower)
#    - ratio=0.0: No checkpointing (fastest but OOM risk)
#
# 5. Mixed Precision:
#    - BF16: RECOMMENDED for H100 (native hardware support)
#    - FP16: Faster on older GPUs, but less stable
#    - FP8: Experimental, requires Transformer Engine
#
# 6. Gradient Accumulation:
#    - accum_steps=8: Effective batch 64 (good balance)
#    - accum_steps=16: Effective batch 128 (more stable, slower)
#    - accum_steps=4: Effective batch 32 (faster, less stable)
# ==============================================================================

# ==============================================================================
# HARDWARE TOPOLOGY (8x H100 Single Node)
# ==============================================================================
# GPU Layout (NVLink 4.0 all-to-all):
#   GPU0 ←→ GPU1 ←→ GPU2 ←→ GPU3
#     ↕       ↕       ↕       ↕
#   GPU4 ←→ GPU5 ←→ GPU6 ←→ GPU7
#
# NVLink Bandwidth:
#   - Per link: 900 GB/s (3.6× faster than PCIe Gen5)
#   - Total bisection: 7.2 TB/s
#   - All-reduce latency: ~100-200 microseconds
#
# Memory Hierarchy:
#   - L2 Cache: 50 MB per GPU (400 MB total)
#   - HBM3: 80 GB per GPU (3.35 TB/s bandwidth)
#   - NVLink: 900 GB/s to other GPUs
#   - PCIe Gen5: 128 GB/s to CPU (for data loading)
# ==============================================================================
