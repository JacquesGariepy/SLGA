seed: 1234
device: cuda

model:
  vocab_size: null             # Automatiquement calé sur le tokenizer chargé
  max_seq_len: 2048
  embed_dim: 512              # Capacité augmentée pour meilleure performance
  num_heads: 8                # Plus de têtes d'attention
  ff_hidden_multiplier: 4     # FFN expansion standard
  n_layers: 12                # Plus de couches pour capacité
  dropout_rate: 0.1

  # Configuration attention locale-globale
  local_window: 128           # Fenêtre locale plus large
  global_k: 24                # Top-K global (réduit, suffisant théoriquement)
  gated_fusion: true          # Fusion apprise local/global
  learned_landmarks: true     # Sélection apprise des landmarks
  dilated_windows: true       # Fenêtres dilatées par couche
  diverse_topk: true          # Top-K avec diversité inter-têtes

train:
  # Curriculum d'apprentissage progressif
  seq_len_start: 384          # 512 → 384 (démarrer plus vite, puis augmenter)
  seq_len_mid: 1024           # Phase intermédiaire
  seq_len_final: 2048         # Objectif final
  seq_len_warmup_steps: 15000 # Étapes pour atteindre seq_len_final

  # OPTIMISÉ POUR RTX 3090 (24GB VRAM)
  batch_size: 8               # passe a 4 en pallier final
  accum_steps: 4              # passe a 8 en pallier final

  lr: 1.5e-4                  # 2.0e-4 → 1.5e-4 (meilleure stabilité)
  betas: [0.9, 0.95]          # Adam betas
  eps: 1.0e-8
  weight_decay: 0.1
  warmup_steps: 5000          # 2000 → 5000 (warmup plus long = meilleure convergence)
  max_steps: 60000
  grad_clip: 1.0

  # Optimisations mémoire/vitesse
  amp: true                   # Automatic Mixed Precision
  amp_dtype: "bf16"           # bfloat16 si supporté, sinon fp16
  grad_checkpointing: true   # en pallier final mettre a true pour réduire l'empreinte mémoire à L=2048
  torch_compile: false        # Peut être activé manuellement (instable parfois)

  # Configuration collator
  collator: "local"           # "local" si learned_landmarks=true, sinon "global"
  global_every: 128           # Pour collator global: landmarks tous les N tokens
  max_global: 64              # Nombre max de landmarks globaux

  # Pénalités auxiliaires pour landmarks appris (v1.6 PARAM GROUPS)
  # 🔧 FIX: Lambdas raisonnables + scorer LR ×5 pour apprentissage efficace
  lambda_spacing: 200.0       # Fourchette raisonnable: 200-1000
  lambda_sparsity: 2.0       # 5.0 Fourchette raisonnable: 5-20
  lambda_diversity: 0.0       # ❌ DEPRECATED: Remplacé par lambda_spacing

  # LR multiplier pour scorer (param groups AdamW)
  scorer_lr_multiplier: 5.0   # Scorer apprend 5× plus vite que le modèle

  # Phase de warmup du global attention (ACTIVÉ TÔT POUR TEST)
  global_warmup_start: 3000   # 30000 → 1000 (déjà passé, actif maintenant!)
  global_warmup_end: 5000     # 50000 → 5000 (plein dans ~1.5h)
  global_weight_warmup_steps: 5000 # Poids du global augmente sur ces étapes

  # Sauvegarde et évaluation (OPTIMISÉ)
  save_every: 200            # 1 → 1000 (trop de checkpoints sinon!)
  keep_last_checkpoints: 10    # NOUVEAU: rotation des checkpoints (garde seulement les 10 derniers)
  eval_every: 750              # 1000 → 500 (validation plus fréquente)
  log_every: 50               # 50 → 10 (affichage TRÈS fréquent pour tests)
  debug_checkpoints: false    # NOUVEAU: désactiver logs debug checkpoint (réduit le bruit)

data:

  keep_last_checkpoints: 10
  eval_every: 750
  log_every: 50
  debug_checkpoints: false
  dataset: "wikimedia/wikipedia"
  subset: "20231101.en"       # Version récente de Wikipedia en anglais
  split_train: "train[:95%]"  # 95% pour training
  split_val: "train[95%:]"    # 5% pour validation
  num_workers: 4              # 0 = single thread (éviter deadlocks complètement)
  max_train_samples: null     # null = tout le dataset
  max_val_samples: false      # Limiter validation pour rapidité

tokenizer: "gpt2"

save:
  out_dir: "out_slga"

log:
  wandb: false                # Activer pour suivi W&B
  project: "slga-plus"
  run_name: null              # Auto-généré si null
  tensorboard: true           # TensorBoard activé

# NOTES:
# - batch_size: 8 au lieu de 4 → Utilise 75-85% du GPU au lieu de 40-50%
# - accum_steps: 8 au lieu de 16 → Gradients mis à jour 2x plus souvent
# - Effective batch = 8 × 8 = 64 (identique à avant)
# - Vitesse: ~2x plus rapide (50K steps en 25h au lieu de 50h)
# - eval_every: 500 au lieu de 1000 → Plus de feedback sur validation
# - log_every: 50 au lieu de 100 → Monitoring plus granulaire
