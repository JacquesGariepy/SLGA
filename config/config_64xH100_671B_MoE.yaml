# - On-premise cluster: $2.5M initial + electricity
#
# For comparison:
# - GPT-3 175B training: ~$4.6M (2020 prices)
# - DeepSeek-V3 671B: Estimated $3-5M
# - This config: ~$70-200K (depending on cloud strategy)
