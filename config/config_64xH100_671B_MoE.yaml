# ==============================================================================
# SLGA-Plus Configuration - 64x H100 80GB (671B MoE - DeepSeek-V3 Scale)
# ==============================================================================
# Hardware: 64x NVIDIA H100 80GB (5.1TB total, 8 nodes × 8 GPUs)
# Model Size: ~671B total parameters, ~37B activated per token
# Architecture: Mixture of Experts (MoE) with SLGA attention
# Training Strategy: Expert Parallelism + 3D Parallelism
# Expected Memory: ~76 GB per GPU (95% utilization)
# Training Speed: ~8-10 minutes per 1K steps
# ==============================================================================
# Inspired by: DeepSeek-V3 (https://github.com/deepseek-ai/DeepSeek-V3)
# ==============================================================================

seed: 1234
device: cuda

model:
  vocab_size: 102400         # 🔧 Larger vocab (like DeepSeek-V3)
  max_seq_len: 32768         # 🔧 128K context (4× longer)
  embed_dim: 7168            # 🔧 DeepSeek-V3 uses 7168
  num_heads: 128             # 🔧 MHA: head_dim = 56
  ff_hidden_multiplier: 1    # MoE handles FFN scaling
  n_layers: 61               # 🔧 DeepSeek-V3 architecture
  dropout_rate: 0.0

  # SLGA Configuration (ultra-long context)
  local_window: 2048         # 🔧 Large local for 128K context
  global_k: 512              # 🔧 512 landmarks
  gated_fusion: true
  learned_landmarks: true
  dilated_windows: true
  diverse_topk: true

  landmark_selector:
    temperature_decay: 0.99995
    min_temperature: 0.9
    use_gumbel: false

  # ============================================================================
  # MIXTURE OF EXPERTS CONFIGURATION (DeepSeek-V3 Style)
  # ============================================================================
  moe:
    enabled: true
    num_experts: 256         # 🔧 256 experts total
    experts_per_token: 8     # 🔧 Top-8 routing (DeepSeek uses 8)
    expert_capacity_factor: 1.25
    expert_dropout: 0.0

    # Expert architecture
    expert_hidden_dim: 12288 # Each expert FFN: 7168 → 12288 → 7168

    # Load balancing
    load_balancing_loss_coef: 0.01
    router_z_loss_coef: 0.001

    # Expert parallelism
    expert_parallel_size: 8  # Distribute 256 experts across 8 GPUs

    # Shared experts (DeepSeek innovation)
    num_shared_experts: 2    # Always active experts
    shared_expert_hidden_dim: 12288

  # Multi-head Latent Attention (DeepSeek-V3)
  use_mla: true              # 🔧 More efficient than MHA
  mla:
    kv_lora_rank: 512        # Compress KV to 512 dim
    qk_nope_head_dim: 128
    qk_rope_head_dim: 64
    v_head_dim: 128

train:
  # Curriculum (128K context)
  seq_len_start: 4096
  seq_len_mid: 16384
  seq_len_final: 32768       # DeepSeek trains to 128K, we use 32K
  seq_len_warmup_steps: 300000

  # ============================================================================
  # 64x H100 CONFIGURATION (8 Nodes, Expert + 3D Parallelism)
  # ============================================================================
  batch_size: 1              # Per GPU
  accum_steps: 2             # Effective batch: 64 × 1 × 2 = 128

  lr: 2.0e-4                 # DeepSeek-V3 LR
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1
  warmup_steps: 50000
  max_steps: 2000000         # 2M steps (DeepSeek scale)
  grad_clip: 1.0

  # Memory optimizations
  amp: true
  amp_dtype: "bf16"
  grad_checkpointing: true
  torch_compile: true

  # 4D Parallelism: Expert + Data + Tensor + Pipeline
  parallelism:
    # Expert Parallel: 256 experts / 8 = 32 experts per GPU group
    expert_parallel_size: 8

    # Data Parallel
    data_parallel_size: 2    # 64 / (8 × 2 × 2) = 2

    # Tensor Parallel
    tensor_parallel_size: 2

    # Pipeline Parallel
    pipeline_parallel_size: 2

    # Verification: 8 (EP) × 2 (DP) × 2 (TP) × 2 (PP) = 64 GPUs ✅

  # FSDP configuration
  fsdp:
    enabled: true
    sharding_strategy: "FULL_SHARD"
    cpu_offload: false
    backward_prefetch: "BACKWARD_PRE"

  # Flash attention + MLA optimizations
  use_flash_attention: true
  use_fused_kernels: true
  activation_checkpointing_ratio: 0.3  # MoE needs less checkpointing

  # Configuration collator
  collator: "local"
  global_every: 2048
  max_global: 1024

  # Loss components
  lambda_spacing: 0.00001
  lambda_sparsity: 0.000001
  lambda_diversity: 0.0
  lambda_load_balance: 0.01  # MoE load balancing

  # Global warmup
  global_warmup_start: 100000
  global_warmup_end: 500000

  # Sauvegarde
  save_every: 25000          # Every 25K steps
  eval_every: 12500
  log_every: 100

# ==============================================================================
# DATASET: Full FineWeb + SlimPajama (14.8T tokens - DeepSeek scale)
# ==============================================================================
data:
  # Use multiple datasets (like DeepSeek)
  datasets:
    - name: "HuggingFaceFW/fineweb-edu"
      weight: 0.5
      subset: "default"
    - name: "cerebras/SlimPajama-627B"
      weight: 0.3
    - name: "togethercomputer/RedPajama-Data-V2"
      weight: 0.2

  split_train: "train[:99.98%]"
  split_val: "train[99.98%:]"
  num_workers: 64
  max_train_samples: null
  max_val_samples: 500000

tokenizer: "deepseek-ai/deepseek-coder-v2-lite-base"  # 102K vocab

save:
  out_dir: "out_slga_671B_moe"

log:
  wandb: true
  project: "slga-671B-moe"
  run_name: "slga-671B-moe-14.8T"
  tensorboard: true

  # MoE-specific metrics
  tensorboard_metrics:
    - expert_load_balance
    - router_z_loss
    - expert_utilization
    - routing_entropy
    - expert_diversity
    - gate_mean
    - gate_std
    - memory_allocated
    - loss_lm

validation:
  enabled: true
  check_every: 10000
  fail_fast: false

# ==============================================================================
# MODEL ARCHITECTURE DETAILS (671B MoE)
# ==============================================================================
# Total Parameters:    671B
# - Shared weights:    ~37B (always active)
# - Expert weights:    ~634B (256 experts × ~2.5B each)
# - Activated/token:   ~37B (5.5% of total)
#
# Memory footprint:
# - Model weights (BF16):     671B × 2 bytes = 1.34 TB
# - With FSDP sharding:       1.34 TB / 64 GPUs = 21 GB per GPU
# - Optimizer states (Adam):  21 GB × 2 = 42 GB per GPU
# - Activations + gradients:  ~10-15 GB per GPU
# - Total per GPU:            ~73-78 GB (fits in 80GB) ✅
#
# Compute efficiency:
# - FLOPs per token:    ~37B × 2 (forward + backward) ≈ 74 GFLOPs
# - vs Dense 671B:      ~671B × 2 ≈ 1342 GFLOPs
# - Speedup:            18× faster than dense 671B
# - Equivalent dense:   Similar quality to ~120-150B dense model
# ==============================================================================

# ==============================================================================
# EXPECTED PERFORMANCE (64x H100, 8 nodes)
# ==============================================================================
# Training Speed:      ~8000-12000 tokens/sec total
# Time per 1K steps:   ~8-10 minutes
# Total training:      2M steps = 16,000 minutes (~11 days)
# Tokens processed:    2M × 128 × 32K = 8.4T tokens
#
# MoE advantages:
# ✅ 671B params but only 37B activated (18× faster than dense)
# ✅ Quality similar to 120-150B dense model
# ✅ 128K context length (SLGA enables this)
# ✅ Expert parallelism scales to 256 experts
#
# DeepSeek-V3 innovations used:
# ✅ Multi-head Latent Attention (MLA) - reduces KV cache
# ✅ Shared experts (2 always active)
# ✅ Top-8 routing (better than Top-2)
# ✅ Load balancing loss (prevents expert collapse)
#
# Scaling law (MoE-adjusted Chinchilla):
# - 671B total / 37B active → treat as ~120B effective
# - Optimal tokens: ~2.4T
# - Training on 14.8T → massively over-trained (SOTA)
# - Expected PPL: ~1.5-2.5 (DeepSeek-V3 level)
# ==============================================================================

# ==============================================================================
# HOW TO RUN (8 Nodes × 8 H100)
# ==============================================================================
# Prerequisites:
# 1. Install MoE library:
#    pip install fairscale  # For MoE layers
#    # OR
#    pip install megablocks # Faster MoE implementation
#
# 2. Install DeepSpeed (supports MoE):
#    pip install deepspeed
#
# 3. Network setup (InfiniBand required):
#    export NCCL_IB_DISABLE=0
#    export NCCL_IB_HCA=mlx5_0,mlx5_1
#    export NCCL_SOCKET_IFNAME=ib0
#    export NCCL_NET_GDR_LEVEL=5
#
# Launch with DeepSpeed:
# deepspeed --num_nodes=8 \
#           --num_gpus=8 \
#           --master_addr=$MASTER_ADDR \
#           --master_port=29500 \
#           scripts/train.py \
#           --config config/config_64xH100_671B_MoE.yaml \
#           --deepspeed ds_config_moe.json
#
# DeepSpeed config (ds_config_moe.json):
# {
#   "train_batch_size": 128,
#   "train_micro_batch_size_per_gpu": 1,
#   "gradient_accumulation_steps": 2,
#   "bf16": {"enabled": true},
#   "zero_optimization": {
#     "stage": 3,
#     "offload_optimizer": {"device": "none"},
#     "overlap_comm": true
#   },
#   "moe": {
#     "enabled": true,
#     "expert_parallel_size": 8,
#     "num_experts": 256,
#     "top_k": 8
#   }
# }
# ==============================================================================

