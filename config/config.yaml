# ============================================================================
# SLGA v2.0 - RTX 3090 (24GB) + STREAMING
# ============================================================================
# Train: ~4,000-6,000 tok/s | Inference: ~500-1,000 tok/s
# ============================================================================

seed: 42

# ============================================================================
# TOKENIZER
# ============================================================================
tokenizer:
  name: "Qwen/Qwen2-7B"

# ============================================================================
# MODEL - 116M params
# ============================================================================
model:
  vocab_size: 152064
  max_seq_len: 131072
  embed_dim: 512
  num_heads: 8
  ff_hidden_multiplier: 4
  n_layers: 12
  dropout_rate: 0.1
  
  local_window: 128
  global_k: 24
  gated_fusion: true
  learned_landmarks: true
  dilated_windows: true
  diverse_topk: true

# ============================================================================
# DATA - STREAMING
# ============================================================================
data:
  dataset: "wikimedia/wikipedia"
  subset: "20231101.en"
  split_train: "train"
  split_val: "train"
  
  # === STREAMING MODE ===
  streaming: true
  shuffle_buffer_size: 10000
  
  max_val_samples: 500
  num_workers: 0                  # 0 pour streaming

# ============================================================================
# TRAINING - RTX 3090 24GB
# ============================================================================
train:
  max_steps: 600000
  
  # === RTX 3090 OPTIMAL ===
  batch_size: 2
  accum_steps: 12                 # Effective batch = 48
  
  lr: 1.5e-4
  warmup_steps: 5000
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1
  grad_clip: 1.0
  
  scorer_lr_multiplier: 5.0
  
  amp: true
  amp_dtype: "bf16"
  grad_checkpointing: true        # Réduit mémoire ~40% pendant backward
  
  # Curriculum
  seq_len_start: 384
  seq_len_mid: 512
  seq_len_final: 1024
  seq_len_warmup_steps: 30000
  
  # Global warmup
  global_warmup_start: 10000
  global_warmup_end: 30000
  
  # Losses
  lambda_spacing: 25.0
  lambda_sparsity: 0.5
  lambda_diversity: 0.0
  
  # Logging
  log_every: 50
  eval_every: 2000
  save_every: 1000
  
  enable_recall_monitoring: false
  out_dir: "out/out_slga"
  keep_last_checkpoints: 3

# ============================================================================
# LORA - Parameter-Efficient Fine-Tuning
# ============================================================================
lora:
  enabled: false
  rank: 8                             # LoRA rank (lower = fewer params)
  alpha: 16.0                         # Scaling factor (higher = stronger adaptation)
  target_modules:                     # Modules to apply LoRA to
    - qkv_proj                        # Attention Q/K/V projections
    - out_proj                        # Attention output projection
    - fc1                             # FFN first layer
    - fc2                             # FFN second layer
  dropout: 0.05                       # LoRA dropout
  use_qlora: false                    # Use 4-bit quantization (requires bitsandbytes)
  merge_weights: false                # Merge LoRA into base after loading

# ============================================================================
# INFERENCE
# ============================================================================
inference:
  batch_size: 1
  max_new_tokens: 256
  temperature: 0.7
  top_k: 50
  top_p: 0.9
  repetition_penalty: 1.2
  no_repeat_ngram_size: 3

# ============================================================================
# EVALUATION - Generation Quality Monitoring
# ============================================================================
# Métriques calculées pendant l'entraînement:
# - Perplexité des générations
# - Diversité (distinct n-grams, entropie)
# - Répétition (taux de répétition, détection de boucles)
# - Cohérence (score gibberish, mots cassés)
# - Score global (0-100) et note (A/B/C/D/F)
# ============================================================================
evaluation:
  generate_every: 2000           # Évaluer la génération tous les N steps
  max_new_tokens: 50             # Tokens à générer par prompt
  temperature: 0.7
  top_k: 50
  top_p: 0.9
  repetition_penalty: 1.2

  # Prompts d'évaluation (optionnel, défauts utilisés sinon)
  prompts:
    - "The cat sat on the"
    - "Albert Einstein was a"
    - "In the year 2024,"
    - "The quick brown fox"
    - "Machine learning is"
    - "Once upon a time"
    - "The capital of France"

# ============================================================================
# SAVE & LOG
# ============================================================================
save:
  out_dir: "out/out_slga"

log:
  tensorboard: true
  wandb: false
  project: "slga-rtx3090"
  system_info_every: 500

# ============================================================================
# MEMORY USAGE (RTX 3090, batch=4, seq=1024)
# ============================================================================
# Model weights:    ~450 MB
# Activations:      ~2-3 GB  
# Gradients:        ~450 MB
# Optimizer:        ~900 MB
# TOTAL:            ~5-6 GB / 24 GB
#
# Si OOM: batch_size: 4→2 ou seq_len_final: 1024→512
# ============================================================================
