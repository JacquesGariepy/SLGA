data:
  dataset: wikimedia/wikipedia
  max_train_samples: null
  max_val_samples: 10000
  num_workers: 4
  split_train: train
  split_val: validation
  subset: 20231101.en
device: cuda
log:
  project: slga-plus
  run_name: null
  tensorboard: true
  wandb: false
model:
  dilated_windows: true
  diverse_topk: true
  dropout_rate: 0.1
  embed_dim: 512
  ff_hidden_multiplier: 4
  gated_fusion: true
  global_k: 24
  learned_landmarks: true
  local_window: 128
  max_seq_len: 2048
  n_layers: 12
  num_heads: 8
  vocab_size: 50257
save:
  out_dir: out_slga
seed: 1234
tokenizer: gpt2
train:
  accum_steps: 8
  amp: true
  amp_dtype: bf16
  batch_size: 8
  betas:
  - 0.9
  - 0.95
  collator: local
  eps: 1.0e-08
  eval_every: 500
  global_every: 128
  global_warmup_end: 50000
  global_warmup_start: 30000
  grad_checkpointing: true
  grad_clip: 1.0
  lambda_diversity: 0.02
  lambda_sparsity: 0.001
  log_every: 50
  lr: 0.0002
  max_global: 64
  max_steps: 50
  save_every: 1000
  seq_len_final: 2048
  seq_len_mid: 1024
  seq_len_start: 512
  seq_len_warmup_steps: 15000
  torch_compile: false
  warmup_steps: 2000
  weight_decay: 0.1
